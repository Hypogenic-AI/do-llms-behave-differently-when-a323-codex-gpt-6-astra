[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.14.1",
    "transformers>=4.51,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
